<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="theme-color" content="#F8F3EA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Daily Tasks</title>
<style>
  :root{
    --bg:#F8F3EA;          /* warm cream */
    --card:#FFFDF9;
    --accent:#C19A6B;      /* camel beige */
    --accent-soft:#E9DCC9;
    --late:#BE6A4F;        /* terracotta */
    --late-soft:#F3E2DA;
    --done:#8FC79B;        /* soft light green */
    --text:#2C2621;
    --text-2:#8D8378;
    --text-3:#B9AFA3;
    --line:rgba(60,45,30,.08);
    --delete:#E5534B;
    --shadow:0 1px 2px rgba(70,50,30,.05),0 4px 14px rgba(70,50,30,.05);
    --top:max(env(safe-area-inset-top),16px);
    --bottom:env(safe-area-inset-bottom);
    --tabbar:56px;
    --ease:cubic-bezier(.25,.8,.25,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg)}
  body{
    position:fixed;inset:0;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    color:var(--text);-webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    touch-action:manipulation;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- screens ---------- */
  .screen{
    position:absolute;left:0;right:0;top:0;bottom:calc(var(--tabbar) + var(--bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:calc(var(--top) + 18px) 18px 120px;
    opacity:0;visibility:hidden;transform:translateY(6px);
    transition:opacity .25s var(--ease),transform .25s var(--ease),visibility 0s .25s;
  }
  .screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}
  .arrange{
    position:absolute;top:calc(var(--top) + 12px);right:18px;height:32px;padding:0 14px;border-radius:16px;
    background:var(--accent-soft);color:#8A6A44;font-size:15px;font-weight:600;transition:background-color .2s,color .2s,opacity .2s;
  }
  .arrange.hide{opacity:0;pointer-events:none}
  body.arranging .arrange{background:var(--accent);color:#fff}
  .move{
    position:absolute;top:calc(var(--top) + 12px);right:18px;height:32px;padding:0 14px;border-radius:16px;z-index:2;
    background:var(--accent-soft);color:#8A6A44;font-size:15px;font-weight:600;transition:background-color .2s,color .2s,opacity .2s;
  }
  .move.hide{opacity:0;pointer-events:none}
  .move.on{background:var(--accent);color:#fff}
  .selecting .row{transition:opacity .2s var(--ease)}
  .selecting .row .card{box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s var(--ease),background-color .2s,transform .3s var(--ease)}
  .selecting .row.picked .card{box-shadow:inset 0 0 0 2px var(--accent);background:#FBF4EA}
  .selecting .row.nopick{opacity:.35;pointer-events:none}
  .movebar{
    position:absolute;left:50%;bottom:calc(var(--tabbar) + var(--bottom) + 18px);z-index:7;
    height:52px;padding:0 26px;border-radius:26px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;white-space:nowrap;
    box-shadow:0 4px 14px rgba(150,110,60,.28);
    transform:translate(-50%,20px);opacity:0;visibility:hidden;
    transition:transform .3s var(--ease),opacity .25s var(--ease),visibility 0s .3s;
  }
  .movebar.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s var(--ease),opacity .25s var(--ease)}
  .movebar:disabled{background:#D9C7AE}
  .movebar:active:not(:disabled){transform:translate(-50%,0) scale(.96)}
  .toast{
    position:absolute;left:50%;top:calc(var(--top) + 8px);z-index:30;padding:10px 18px;border-radius:20px;
    background:rgba(44,38,33,.88);color:#fff;font-size:15px;font-weight:500;white-space:nowrap;
    transform:translate(-50%,-12px);opacity:0;visibility:hidden;
    transition:transform .3s var(--ease),opacity .25s var(--ease),visibility 0s .3s;
  }
  .toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s var(--ease),opacity .25s var(--ease)}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-bottom:2px}
  h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-bottom:22px}
  .empty{color:var(--text-3);text-align:center;font-size:16px;padding:56px 20px;line-height:1.5;display:none}
  .empty.show{display:block;animation:fade .4s var(--ease)}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ---------- task cards ---------- */
  .list{position:relative;display:flex;flex-wrap:wrap;gap:10px;direction:rtl;align-items:flex-start}
  .row{
    position:relative;border-radius:16px;flex:0 1 auto;max-width:80%;min-width:96px;
    box-shadow:var(--shadow);background:var(--delete);overflow:hidden;
    transition:opacity .2s var(--ease);
  }
  .row .x{
    display:none;position:absolute;top:-8px;left:-8px;z-index:3;width:24px;height:24px;border-radius:50%;
    background:#A39A8F;color:#fff;place-items:center;box-shadow:0 1px 4px rgba(60,40,20,.2);
  }
  .row .x::before{content:"";position:absolute;inset:-10px}
  .row .x svg{width:10px;height:10px;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
  body.arranging #today-list .row{overflow:visible;animation:jiggle .26s ease-in-out infinite alternate}
  body.arranging #today-list .row:nth-child(2n){animation-delay:-.13s;animation-direction:alternate-reverse}
  body.arranging #today-list .row .x{display:grid}
  body.arranging #today-list .del{display:none}
  body.arranging #today-list .card{touch-action:none}
  .row.dragging{animation:none!important;z-index:10;box-shadow:0 12px 30px rgba(70,50,30,.18)}
  @keyframes jiggle{from{rotate:-1.4deg}to{rotate:1.4deg}}
  .row .del{
    position:absolute;top:0;left:0;bottom:0;width:80px;
    color:#fff;font-size:15px;font-weight:600;opacity:0;transition:opacity .15s;
  }
  .row.swiping .del,.row.open .del{opacity:1}
  .row:not(.swiping):not(.open){background:var(--card)}
  .card{
    position:relative;display:flex;align-items:center;gap:14px;direction:rtl;text-align:right;
    background:var(--card);padding:13px 15px;min-height:50px;border-radius:16px;gap:11px;
    touch-action:pan-y;
    transition:transform .3s var(--ease),background-color .2s;
  }
  .card.pressing{background:#F6F0E6}
  .check{
    flex:none;width:26px;height:26px;border-radius:50%;
    border:2px solid var(--accent);position:relative;
    transition:background-color .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease);
  }
  .check svg{position:absolute;inset:0;margin:auto;width:14px;height:14px}
  .check path{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease) .05s}
  .card.done .check{background:var(--done);border-color:var(--done);transform:scale(1)}
  .card.done .check path{stroke-dashoffset:0}
  .card.pop .check{animation:pop .35s var(--ease)}
  @keyframes pop{40%{transform:scale(1.18)}}
  .body{flex:1;min-width:0}
  .text{unicode-bidi:plaintext;text-align:right;font-size:17px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap;transition:color .25s}
  .card.done .text{color:var(--text-2)}
  .date{direction:ltr;text-align:right;font-size:13px;color:var(--text-2);margin-top:3px}
  .card.late .check{border-color:var(--late)}
  .card.late .text{color:var(--late)}
  .card.late .date{color:var(--late);opacity:.75}
  .row.enter{animation:enter .35s var(--ease)}
  @keyframes enter{from{opacity:0;transform:translateY(10px) scale(.98)}}

  /* ---------- + button ---------- */
  .add{
    position:absolute;right:20px;bottom:calc(var(--tabbar) + var(--bottom) + 18px);
    width:60px;height:60px;border-radius:50%;background:var(--accent);
    box-shadow:0 4px 14px rgba(150,110,60,.28);display:grid;place-items:center;
    transition:transform .2s var(--ease),opacity .25s var(--ease),visibility 0s;z-index:5;
  }
  .add:active{transform:scale(.92)}
  .add svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
  .add.hidden{opacity:0;visibility:hidden;transform:scale(.8);transition:transform .2s,opacity .2s,visibility 0s .2s}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;z-index:10;
    height:calc(var(--tabbar) + var(--bottom));padding-bottom:var(--bottom);
    display:flex;background:rgba(248,243,234,.88);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--line);
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:10.5px;font-weight:500;transition:color .2s}
  .tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab.active{color:var(--accent)}

  /* ---------- calendar ---------- */
  .cal{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 12px 12px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 12px}
  .cal-title{font-size:18px;font-weight:600}
  .cal-nav{display:flex;gap:4px}
  .cal-nav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
  .cal-nav button:active{background:var(--accent-soft)}
  .cal-nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
  .wd{font-size:12px;font-weight:600;color:var(--text-3);padding-bottom:6px}
  .day{position:relative;height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:50%}
  .day span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background-color .15s}
  .day:active span{background:var(--accent-soft)}
  .day.today span{color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
  .day.future{color:var(--text-3);pointer-events:none}
  .day i{position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .day i.late{background:var(--late)}

  /* ---------- day page (pushed from History) ---------- */
  .dayview{
    position:absolute;left:0;right:0;top:0;bottom:calc(var(--tabbar) + var(--bottom));
    background:var(--bg);z-index:6;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(var(--top) + 6px) 18px 120px;
    transform:scale(.82);opacity:0;visibility:hidden;transform-origin:50% 45%;
    transition:transform .32s cubic-bezier(.32,.72,0,1),opacity .25s var(--ease),visibility 0s .32s;
  }
  .dayview.open{transform:none;opacity:1;visibility:visible;transition:transform .42s cubic-bezier(.32,.72,0,1),opacity .2s var(--ease)}
  .back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;height:44px;margin-left:-8px;padding-right:12px}
  .back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- add / edit sheet ---------- */
  .overlay{
    position:fixed;inset:0;z-index:20;background:rgba(44,38,33,.22);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility 0s .25s;
  }
  .overlay.open{opacity:1;visibility:visible;transition:opacity .25s var(--ease)}
  .sheet{
    position:absolute;left:14px;right:14px;top:calc(var(--top) + 40px);
    background:var(--card);border-radius:22px;padding:18px;
    box-shadow:0 10px 40px rgba(60,40,20,.18);
    transform:translateY(-14px) scale(.97);transition:transform .3s var(--ease);
  }
  .overlay.open .sheet{transform:none}
  .sheet-title{font-size:15px;font-weight:600;color:var(--text-2);text-align:center;margin-bottom:12px}
  .sheet textarea{
    width:100%;min-height:52px;max-height:40vh;resize:none;border:0;outline:0;
    background:#F6F0E6;border-radius:14px;padding:14px;font:inherit;font-size:17px;line-height:1.35;color:var(--text);
    -webkit-user-select:text;user-select:text;
  }
  .sheet textarea::placeholder{color:var(--text-3)}
  .sheet-btns{display:flex;gap:10px;margin-top:14px}
  .sheet-btns button{flex:1;height:48px;border-radius:14px;font-size:17px;font-weight:600}
  .btn-cancel{background:#F1EAE0;color:var(--text-2)}
  .btn-save{background:var(--accent);color:#fff;transition:opacity .2s}
  .btn-save:disabled{opacity:.4}
</style>
</head>
<body>

<!-- TODAY -->
<section class="screen active" id="s-today">
  <button class="arrange hide" id="arrange">Arrange</button>
  <div class="eyebrow" id="today-weekday"></div>
  <h1 id="today-date"></h1>
  <div class="list" id="today-list"></div>
  <div class="empty" id="today-empty">No tasks yet.<br>Tap + to add one.</div>
</section>

<!-- HISTORY -->
<section class="screen" id="s-history">
  <div class="eyebrow">&nbsp;</div>
  <h1>History</h1>
  <div class="cal">
    <div class="cal-head">
      <div class="cal-title" id="cal-title"></div>
      <div class="cal-nav">
        <button id="cal-prev" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="cal-next" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</section>

<!-- DAY PAGE (from History) -->
<section class="dayview" id="dayview">
  <button class="move hide" id="day-move">Move</button>
  <button class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>History</button>
  <div class="eyebrow" id="day-weekday" style="margin-top:8px"></div>
  <h1 id="day-date"></h1>
  <div class="list" id="day-list"></div>
  <div class="empty" id="day-empty">No tasks on this day.</div>
</section>

<!-- UNFINISHED -->
<section class="screen" id="s-unfinished">
  <button class="move hide" id="unf-move">Move</button>
  <div class="eyebrow">&nbsp;</div>
  <h1>Unfinished</h1>
  <div class="list" id="unf-list"></div>
  <div class="empty" id="unf-empty">Nothing left behind.</div>
</section>

<button class="movebar" id="movebar" disabled>Move to Today</button>
<div class="toast" id="toast"></div>

<button class="add" id="add" aria-label="Add task"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabbar">
  <button class="tab" data-tab="history">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>History
  </button>
  <button class="tab active" data-tab="today">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.6"/></svg>Today
  </button>
  <button class="tab" data-tab="unfinished">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Unfinished
  </button>
</nav>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-title" id="sheet-title">New Task</div>
    <textarea id="input" rows="1" placeholder="What do you need to do?" enterkeyhint="done"></textarea>
    <div class="sheet-btns">
      <button class="btn-cancel" id="cancel">Cancel</button>
      <button class="btn-save" id="save">Add</button>
    </div>
  </div>
</div>

<script>
(() => {
  /* ---------- storage ---------- */
  const KEY = 'dailyTasks.v1';
  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* ---------- dates ---------- */
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => keyOf(new Date());
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const fmt = (k, o) => parseKey(k).toLocaleDateString('en-US', o);
  let currentDay = today();

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);
  const DEL_W = 80;
  const CHECK_SVG = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  const byId = id => tasks.find(t => t.id === id);

  /* ---------- card ---------- */
  // ctx: 'today' | 'day' | 'unfinished'
  function makeRow(task, ctx) {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.id = task.id;
    row.innerHTML =
      '<button class="del">Delete</button>' +
      '<button class="x" aria-label="Delete"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>' +
      '<div class="card"><div class="check">' + CHECK_SVG + '</div>' +
      '<div class="body"><div class="text"></div>' +
      (ctx === 'unfinished' ? '<div class="date"></div>' : '') + '</div></div>';
    const card = row.querySelector('.card');
    row.querySelector('.text').textContent = task.text;
    if (ctx === 'unfinished') row.querySelector('.date').textContent = fmt(task.date, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    paint(card, task);
    row.querySelector('.del').addEventListener('click', () => removeTask(task.id));
    row.querySelector('.x').addEventListener('click', () => removeTask(task.id));
    gestures(row, card, task, ctx);
    return row;
  }

  function paint(card, task) {
    card.classList.toggle('done', task.done);
    card.classList.toggle('late', !task.done && task.date < today());
  }

  function setOpen(row, open) {
    row.classList.toggle('open', open);
    row.querySelector('.card').style.transform = open ? 'translateX(' + DEL_W + 'px)' : '';
    if (!open) setTimeout(() => { if (!row.classList.contains('open')) row.classList.remove('swiping'); }, 300);
  }
  function closeAllSwipes(except) {
    document.querySelectorAll('.row.open').forEach(r => { if (r !== except) setOpen(r, false); });
  }

  /* ---------- gestures: tap = done, swipe left = delete, long press = edit ---------- */
  function gestures(row, card, task, ctx) {
    let sx, sy, dx = 0, base = 0, active = false, moved = false, horiz = false, longPressed = false, timer;

    card.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      if (arranging && ctx === 'today') { startDrag(e, row); return; }
      closeAllSwipes(row);
      if (selecting && ctx !== 'today') {
        sx = e.clientX; sy = e.clientY; active = true; moved = false; horiz = false; longPressed = false;
        return;
      }
      sx = e.clientX; sy = e.clientY; dx = 0;
      base = row.classList.contains('open') ? DEL_W : 0;
      active = true; moved = false; horiz = false; longPressed = false;
      card.classList.add('pressing');
      timer = setTimeout(() => {
        if (!moved && active) {
          longPressed = true;
          card.classList.remove('pressing');
          if (row.classList.contains('open')) setOpen(row, false);
          openSheet(task.id);
        }
      }, 480);
    });

    card.addEventListener('pointermove', e => {
      if (!active) return;
      const mx = e.clientX - sx, my = e.clientY - sy;
      if (selecting && ctx !== 'today') { if (Math.hypot(mx, my) > 8) moved = true; return; }
      if (!moved && Math.hypot(mx, my) > 8) {
        moved = true; clearTimeout(timer); card.classList.remove('pressing');
        horiz = Math.abs(mx) > Math.abs(my);
        if (horiz) { row.classList.add('swiping'); try { card.setPointerCapture(e.pointerId); } catch (_) {} }
      }
      if (moved && horiz) {
        let x = base + mx;
        if (x < 0) x = 0;
        if (x > DEL_W) x = DEL_W + (x - DEL_W) * 0.35; // rubber band
        dx = x;
        card.style.transition = 'none';
        card.style.transform = 'translateX(' + x + 'px)';
      }
    });

    const end = cancelled => {
      if (!active) return;
      active = false; clearTimeout(timer); card.classList.remove('pressing');
      card.style.transition = '';
      if (selecting && ctx !== 'today') { if (!moved && !cancelled) pick(row, task); return; }
      if (longPressed) return;
      if (moved) {
        if (horiz) setOpen(row, dx > DEL_W / 2);
        return;
      }
      if (cancelled) return;
      if (row.classList.contains('open')) { setOpen(row, false); return; }
      toggle(task.id, row, card, ctx);
    };
    card.addEventListener('pointerup', () => end(false));
    card.addEventListener('pointercancel', () => end(true));
    card.addEventListener('contextmenu', e => e.preventDefault());
  }

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.row.open')) closeAllSwipes();
  });

  /* ---------- actions ---------- */
  function toggle(id, row, card, ctx) {
    const t = byId(id); if (!t) return;
    t.done = !t.done;
    save();
    paint(card, t);
    card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
    if (ctx === 'unfinished' && t.done) {
      setTimeout(() => { const n = byId(id); if (n && n.done) collapse(row, refreshEmpties); }, 750);
    }
    if (ctx === 'unfinished' && !t.done) row.style.opacity = '';
  }

  function removeTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    document.querySelectorAll('.row[data-id="' + id + '"]').forEach(r => collapse(r, refreshEmpties));
    renderCalendar();
  }

  // Smoothly slides the other cards into their new places after a change
  function flip(list, mutate, skip) {
    const before = new Map([...list.children].map(r => [r, r.getBoundingClientRect()]));
    mutate();
    const rows = [...list.children].filter(r => r !== skip);
    rows.forEach(r => { r.style.transition = 'none'; r.style.transform = ''; });
    rows.forEach(r => {
      const b = before.get(r); if (!b) return;
      const a = r.getBoundingClientRect();
      const dx = b.left - a.left, dy = b.top - a.top;
      if (dx || dy) r.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    });
    void list.offsetWidth;
    rows.forEach(r => { r.style.transition = 'transform .32s var(--ease),opacity .2s var(--ease)'; r.style.transform = ''; });
  }

  function collapse(row, done) {
    row.style.transition = 'opacity .2s var(--ease),transform .2s var(--ease)';
    row.style.opacity = '0'; row.style.transform = 'scale(.8)';
    setTimeout(() => {
      const list = row.parentElement;
      if (list) flip(list, () => row.remove()); else row.remove();
      done && done();
    }, 200);
  }

  /* ---------- arrange mode: drag cards to reorder (like iPhone apps) ---------- */
  let arranging = false, drag = null;
  function setArranging(on) {
    arranging = on && $('today-list').children.length > 0;
    document.body.classList.toggle('arranging', arranging);
    $('arrange').textContent = arranging ? 'Done' : 'Arrange';
    if (arranging) closeAllSwipes();
  }
  $('arrange').addEventListener('click', () => setArranging(!arranging));

  function startDrag(e, row) {
    e.preventDefault();
    const list = row.parentElement, lr = list.getBoundingClientRect();
    row.style.transition = 'none'; row.style.transform = '';
    drag = { row, list, gx: e.clientX - (lr.left + row.offsetLeft), gy: e.clientY - (lr.top + row.offsetTop), last: null, t: 0 };
    row.classList.add('dragging');
    placeDrag(e);
  }
  function placeDrag(e) {
    const { row, list, gx, gy } = drag, lr = list.getBoundingClientRect();
    const tx = e.clientX - gx - (lr.left + row.offsetLeft), ty = e.clientY - gy - (lr.top + row.offsetTop);
    row.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(1.06)';
  }
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    e.preventDefault();
    const { row, list } = drag, lr = list.getBoundingClientRect();
    const px = e.clientX - lr.left, py = e.clientY - lr.top, now = Date.now();
    const over = [...list.children].find(r => r !== row &&
      px >= r.offsetLeft && px <= r.offsetLeft + r.offsetWidth && py >= r.offsetTop && py <= r.offsetTop + r.offsetHeight);
    if (over && !(over === drag.last && now - drag.t < 400)) {
      const kids = [...list.children];
      const after = kids.indexOf(over) > kids.indexOf(row);
      flip(list, () => after ? over.after(row) : over.before(row), row);
      drag.last = over; drag.t = now;
    }
    placeDrag(e);
  }, { passive: false });
  const endDrag = () => {
    if (!drag) return;
    const { row, list } = drag;
    drag = null;
    row.classList.remove('dragging');
    row.style.transition = 'transform .3s var(--ease)';
    row.style.transform = '';
    const ids = [...list.children].map(r => r.dataset.id), set = new Set(ids);
    tasks = tasks.filter(t => !set.has(t.id)).concat(ids.map(byId).filter(Boolean));
    save();
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  function refreshEmpties() {
    const n = $('today-list').children.length;
    $('arrange').classList.toggle('hide', n < 2 && !arranging);
    if (!n && arranging) setArranging(false);
    $('today-empty').classList.toggle('show', !n);
    $('unf-empty').classList.toggle('show', !$('unf-list').children.length);
    $('day-empty').classList.toggle('show', !$('day-list').children.length);
    const dayCan = !!openDayKey && openDayKey < today() && tasks.some(t => t.date === openDayKey && !t.done);
    $('day-move').classList.toggle('hide', !dayCan && selecting !== 'day');
    $('unf-move').classList.toggle('hide', !$('unf-list').children.length && selecting !== 'unfinished');
  }

  /* ---------- move unfinished tasks to today ---------- */
  let selecting = null; // null | 'day' | 'unfinished'
  const picked = new Set();
  const selList = () => $(selecting === 'day' ? 'day-list' : 'unf-list');
  const selBtn = () => $(selecting === 'day' ? 'day-move' : 'unf-move');

  function startSelect(where) {
    stopSelect();
    selecting = where;
    closeAllSwipes();
    const list = selList();
    list.classList.add('selecting');
    [...list.children].forEach(r => { const t = byId(r.dataset.id); r.classList.toggle('nopick', !t || t.done); });
    selBtn().classList.add('on'); selBtn().textContent = 'Cancel';
    updateMoveBar();
    $('movebar').classList.add('show');
  }
  function stopSelect() {
    if (!selecting) return;
    const list = selList();
    list.classList.remove('selecting');
    [...list.children].forEach(r => r.classList.remove('picked', 'nopick'));
    selBtn().classList.remove('on'); selBtn().textContent = 'Move';
    selecting = null; picked.clear();
    $('movebar').classList.remove('show');
    refreshEmpties();
  }
  function pick(row, task) {
    if (task.done) return;
    if (picked.has(task.id)) picked.delete(task.id); else picked.add(task.id);
    row.classList.toggle('picked', picked.has(task.id));
    updateMoveBar();
  }
  function updateMoveBar() {
    const n = picked.size;
    $('movebar').disabled = !n;
    $('movebar').textContent = n ? 'Move ' + n + ' to Today' : 'Select tasks to move';
  }
  let toastTimer;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }
  $('day-move').addEventListener('click', () => selecting === 'day' ? stopSelect() : startSelect('day'));
  $('unf-move').addEventListener('click', () => selecting === 'unfinished' ? stopSelect() : startSelect('unfinished'));
  $('movebar').addEventListener('click', () => {
    if (!picked.size) return;
    const k = today(), ids = new Set(picked);
    const moving = tasks.filter(t => ids.has(t.id) && !t.done);
    moving.forEach(t => { t.date = k; });
    tasks = tasks.filter(t => !ids.has(t.id)).concat(moving);
    save();
    const list = selList(), n = moving.length;
    [...list.children].filter(r => ids.has(r.dataset.id)).forEach(r => collapse(r, refreshEmpties));
    stopSelect();
    renderCalendar();
    toast(n === 1 ? 'Moved 1 task to Today' : 'Moved ' + n + ' tasks to Today');
  });

  /* ---------- add / edit sheet ---------- */
  let editingId = null;
  const overlay = $('overlay'), input = $('input'), saveBtn = $('save');

  function openSheet(id) {
    editingId = id || null;
    $('sheet-title').textContent = editingId ? 'Edit Task' : 'New Task';
    saveBtn.textContent = editingId ? 'Save' : 'Add';
    input.value = editingId ? byId(editingId).text : '';
    overlay.classList.add('open');
    autosize(); updateSave();
    input.focus();
    if (editingId) input.setSelectionRange(input.value.length, input.value.length);
  }
  function closeSheet() { overlay.classList.remove('open'); input.blur(); editingId = null; }
  function autosize() { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; }
  function updateSave() { saveBtn.disabled = !input.value.trim(); }

  function commit() {
    const text = input.value.trim();
    if (!text) return;
    if (editingId) {
      const t = byId(editingId);
      if (t) {
        t.text = text; save();
        document.querySelectorAll('.row[data-id="' + t.id + '"] .text').forEach(el => el.textContent = text);
      }
    } else {
      const t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), text, date: today(), done: false };
      tasks.push(t); save();
      const row = makeRow(t, 'today');
      row.classList.add('enter');
      $('today-list').appendChild(row);
      refreshEmpties();
      setTimeout(() => row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    }
    closeSheet();
  }

  $('add').addEventListener('click', () => { setArranging(false); openSheet(null); });
  $('cancel').addEventListener('click', closeSheet);
  saveBtn.addEventListener('click', commit);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });
  input.addEventListener('input', () => { autosize(); updateSave(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); } });

  /* ---------- screens ---------- */
  function renderToday() {
    const k = today();
    $('today-weekday').textContent = fmt(k, { weekday: 'long' });
    $('today-date').textContent = fmt(k, { month: 'long', day: 'numeric' });
    const list = $('today-list'); list.innerHTML = '';
    tasks.filter(t => t.date === k).forEach(t => list.appendChild(makeRow(t, 'today')));
    refreshEmpties();
  }

  function renderUnfinished() {
    const k = today();
    const list = $('unf-list'); list.innerHTML = '';
    tasks.filter(t => !t.done && t.date < k)
      .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0)
      .forEach(t => list.appendChild(makeRow(t, 'unfinished')));
    refreshEmpties();
  }

  let calMonth = new Date(); calMonth.setDate(1);
  function renderCalendar() {
    const y = calMonth.getFullYear(), m = calMonth.getMonth(), k = today();
    $('cal-title').textContent = calMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const grid = $('cal-grid'); grid.innerHTML = '';
    ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(d => { const e = document.createElement('div'); e.className = 'wd'; e.textContent = d; grid.appendChild(e); });
    const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
    for (let d = 1; d <= days; d++) {
      const dk = keyOf(new Date(y, m, d));
      const b = document.createElement('button');
      b.className = 'day' + (dk === k ? ' today' : '') + (dk > k ? ' future' : '');
      b.innerHTML = '<span>' + d + '</span>';
      const dayTasks = tasks.filter(t => t.date === dk);
      if (dayTasks.length) {
        const dot = document.createElement('i');
        if (dk < k && dayTasks.some(t => !t.done)) dot.className = 'late';
        b.appendChild(dot);
      }
      b.addEventListener('click', () => dk === k ? showTab('today') : openDay(dk));
      grid.appendChild(b);
    }
    const now = new Date();
    $('cal-next').style.visibility = (y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth())) ? 'hidden' : 'visible';
  }
  $('cal-prev').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() - 1); renderCalendar(); });
  $('cal-next').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() + 1); renderCalendar(); });

  let openDayKey = null;
  function openDay(dk) {
    openDayKey = dk;
    $('day-weekday').textContent = fmt(dk, { weekday: 'long' });
    $('day-date').textContent = fmt(dk, { month: 'long', day: 'numeric', year: 'numeric' });
    const list = $('day-list'); list.innerHTML = '';
    tasks.filter(t => t.date === dk).forEach(t => list.appendChild(makeRow(t, 'day')));
    refreshEmpties();
    $('dayview').scrollTop = 0;
    $('dayview').classList.add('open');
  }
  function closeDay() { stopSelect(); $('dayview').classList.remove('open'); openDayKey = null; renderCalendar(); }
  $('back').addEventListener('click', closeDay);

  let tab = 'today';
  function showTab(name) {
    closeAllSwipes();
    stopSelect();
    if (name !== 'today') setArranging(false);
    if (name === tab && name === 'history' && openDayKey) { closeDay(); return; }
    tab = name;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 's-' + name));
    $('add').classList.toggle('hidden', name !== 'today');
    if (name !== 'history' && openDayKey) { $('dayview').classList.remove('open'); openDayKey = null; }
    if (name === 'today') renderToday();
    if (name === 'history') { calMonth = new Date(); calMonth.setDate(1); renderCalendar(); }
    if (name === 'unfinished') renderUnfinished();
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

  /* ---------- midnight: start a fresh day ---------- */
  function checkNewDay() {
    const k = today();
    if (k === currentDay) return;
    currentDay = k;
    stopSelect();
    renderToday();
    renderUnfinished();
    renderCalendar();
    if (openDayKey) openDay(openDayKey);
  }
  setInterval(checkNewDay, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
  window.addEventListener('focus', checkNewDay);
  window.addEventListener('pageshow', checkNewDay);

  renderToday();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
